<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lupa Password - RIFORA</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f3f6f9;
            --card: #ffffff;
            --soft: #f7f9fb;
            --text: #243447;
            --secondary: #687786;
            --muted: #8994a0;
            --primary: #17365d;
            --primary-hover: #245a8d;
            --border: #dce3e9;
            --input: #ffffff;
            --shadow: 0 20px 55px rgba(31, 52, 73, 0.12);
        }

        html[data-theme="dark"] {
            --bg: #0e151c;
            --card: #17212b;
            --soft: #1d2a35;
            --text: #edf3f7;
            --secondary: #b3c0c9;
            --muted: #8d9ba6;
            --primary: #5f91bd;
            --primary-hover: #78a8cf;
            --border: #30404c;
            --input: #111a22;
            --shadow: 0 20px 55px rgba(0, 0, 0, 0.35);
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                var(--bg);

            color:
                var(--text);

            position: relative;

            overflow: hidden;
        }

        .rifora-bg {

            position: fixed;
            inset: 0;

            z-index: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(23, 54, 93, 0.04) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(23, 54, 93, 0.04) 1px,
                    transparent 1px
                );

            background-size: 32px 32px;
        }

        html[data-theme="dark"] .rifora-bg {

            background-image:
                linear-gradient(
                    rgba(141, 180, 216, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(141, 180, 216, 0.035) 1px,
                    transparent 1px
                );
        }

        .rifora-bg::before,
        .rifora-bg::after {

            content: "";

            position: absolute;

            border-radius: 50%;
        }

        .rifora-bg::before {

            width: 550px;
            height: 550px;

            top: -280px;
            left: -220px;

            background:
                radial-gradient(
                    circle,
                    rgba(23, 54, 93, 0.07),
                    transparent 70%
                );
        }

        .rifora-bg::after {

            width: 600px;
            height: 600px;

            right: -280px;
            bottom: -300px;

            background:
                radial-gradient(
                    circle,
                    rgba(36, 90, 141, 0.07),
                    transparent 70%
                );
        }

        .data-curve {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 55vh;

            min-height: 300px;

            opacity: 1;
        }

        .data-curve path {
            transition: stroke 0.3s ease;
        }

        .card {

            width: 100%;

            max-width: 480px;

            padding: 42px;

            position: relative;

            z-index: 1;

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 20px;

            box-shadow:
                var(--shadow);
        }

        .theme-toggle {

            position: absolute;

            top: 20px;
            right: 20px;

            width: 42px;
            height: 42px;

            border:
                1px solid var(--border);

            border-radius: 50%;

            background:
                var(--soft);

            color:
                var(--text);

            cursor: pointer;

            font-size: 18px;
        }

        .brand {

            width: 52px;
            height: 52px;

            margin-bottom: 22px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                var(--primary);

            color: white;

            font-weight: 700;
        }

        h1 {

            margin:
                0 0 10px;

            font-size: 28px;

            color:
                var(--text);
        }

        .description {

            margin:
                0 0 26px;

            font-size: 15px;

            line-height: 1.7;

            color:
                var(--secondary);
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 650;
        }

        input {

            width: 100%;

            height: 48px;

            padding:
                0 14px;

            border:
                1px solid var(--border);

            border-radius: 8px;

            background:
                var(--input);

            color:
                var(--text);

            font-family: inherit;

            outline: none;
        }

        input:focus {

            border-color:
                var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(36, 90, 141, 0.12);
        }

        button[type="submit"] {

            width: 100%;

            height: 48px;

            margin-top: 20px;

            border: none;

            border-radius: 8px;

            background:
                var(--primary);

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 650;

            cursor: pointer;
        }

        button[type="submit"]:hover {

            background:
                var(--primary-hover);
        }

        .back {

            margin-top: 22px;

            text-align: center;

            font-size: 14px;
        }

        .back a {

            color:
                var(--primary);

            font-weight: 650;

            text-decoration: none;
        }

        .back a:hover {

            text-decoration: underline;
        }

        @media (max-width: 520px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 34px 25px;
            }

        }

    </style>

</head>


<body>
<svg class="data-curve rifora-animated-curve" viewBox="0 0 1440 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="none" stroke="rgba(23,54,93,.15)" stroke-width="4" d="M0,300 C200,100 400,400 700,200 C1000,0 1200,300 1440,150"></path><path fill="none" stroke="rgba(23,54,93,.10)" stroke-width="3" d="M0,350 C300,150 500,450 900,150 C1200,-50 1300,350 1440,250"></path><path fill="none" stroke="rgba(36,90,141,.08)" stroke-width="2.5" d="M0,250 C250,50 450,350 800,250 C1100,150 1250,250 1440,50"></path></svg>


<div class="rifora-bg"></div>


<div class="card">


    <button
        type="button"
        class="theme-toggle"
        id="themeToggle"
        title="Ubah tema"
        aria-label="Ubah tema"
    >
        ☾
    </button>

    

    <h1>
        Lupa Password?
    </h1>


    <p class="description">
        Masukkan email yang terdaftar pada akun
        RIFORA. Kami akan memberikan tautan
        untuk membuat password baru.
    </p>


    <form method="post">

        {% csrf_token %}


        <label for="id_email">
            Email
        </label>


        {{ form.email }}


        <button type="submit">
            Kirim Tautan Reset Password
        </button>

    </form>


    <div class="back">

        <a href="{% url 'login' %}">
            Kembali ke Login
        </a>

    </div>

</div>



<script>

(function () {

    const savedTheme =
        localStorage.getItem("rifora-theme");

    const systemDark =
        window.matchMedia &&
        window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches;

    const theme =
        savedTheme ||
        (systemDark ? "dark" : "light");


    document.documentElement.setAttribute(
        "data-theme",
        theme
    );


    const toggle =
        document.getElementById("themeToggle");


    function updateIcon() {

        const current =
            document.documentElement.getAttribute(
                "data-theme"
            );

        toggle.textContent =
            current === "dark"
                ? "☀"
                : "☾";
    }


    updateIcon();


    toggle.addEventListener(
        "click",
        function () {

            const current =
                document.documentElement.getAttribute(
                    "data-theme"
                );

            const next =
                current === "dark"
                    ? "light"
                    : "dark";


            document.documentElement.setAttribute(
                "data-theme",
                next
            );


            localStorage.setItem(
                "rifora-theme",
                next
            );


            updateIcon();

        }
    );

})();

</script>



<footer class="rifora-footer">@RIFORA 2026. All rights reserved.</footer>

</body>


<style>
.rifora-footer{
    position:fixed;
    left:0;
    right:0;
    bottom:16px;
    z-index:2;
    text-align:center;
    font-size:12px;
    line-height:1.4;
    color:var(--muted, #89949b);
    pointer-events:none;
}
</style>

</html>
<style>
/* RIFORA — login-style wave; only the strokes animate */
.rifora-animated-curve{position:fixed;left:0;bottom:0;width:100%;height:55vh;min-height:300px;z-index:0;pointer-events:none;overflow:hidden}
.rifora-animated-curve path{transform-box:fill-box;transform-origin:center;animation:riforaRealWave 12s ease-in-out infinite alternate}
.rifora-animated-curve path:nth-child(2){animation-duration:15s;animation-delay:-3s}.rifora-animated-curve path:nth-child(3){animation-duration:18s;animation-delay:-7s}
@keyframes riforaRealWave{0%{transform:translate3d(-2.5%,1.2%,0) scaleY(.97)}50%{transform:translate3d(0,-1.5%,0) scaleY(1.025)}100%{transform:translate3d(2.5%,1%,0) scaleY(.98)}}
html[data-theme="dark"] .rifora-animated-curve path:nth-child(1){stroke:rgba(141,180,216,.38);stroke-width:5}html[data-theme="dark"] .rifora-animated-curve path:nth-child(2){stroke:rgba(141,180,216,.27);stroke-width:4}html[data-theme="dark"] .rifora-animated-curve path:nth-child(3){stroke:rgba(95,145,189,.22);stroke-width:3.5}
@media (prefers-reduced-motion:reduce){.rifora-animated-curve path{animation:none}}
</style>
